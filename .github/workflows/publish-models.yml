name: Publish IFS and GFS tiles
on:
  schedule:
    - cron: '7,37 * * * *'
  push:
    branches: [main]
    paths: ['.github/workflows/publish-models.yml', 'automation/production.py']
  workflow_dispatch:
    inputs:
      scope:
        description: Published products
        type: choice
        options: [auto, height, full]
        default: auto
permissions:
  contents: read
jobs:
  # 一轮只做一次决策：检查完源站与已发布状态后，把「哪个模式、哪几个分片」写成矩阵。
  # 各分片自己判断会互相矛盾（0 号看到别人在写、2 号看到可以写），所以检查和清旧批都集中在这里。
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      targets: ${{ steps.plan.outputs.targets }}
      count: ${{ steps.plan.outputs.count }}
    env:
      POLYGON_CLIPPING_MAX_QUEUE_SIZE: '2000000'
      SCOPE: ${{ inputs.scope || 'auto' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install readiness checker
        if: env.SCOPE == 'auto'
        run: python -m pip install --disable-pip-version-check requests==2.32.3 boto3==1.44.3
      - name: Inspect IFS
        id: ifs
        if: env.SCOPE == 'auto'
        env:
          MODEL: IFS
          IFS_R2_ACCOUNT_ID: ${{ secrets.IFS_R2_ACCOUNT_ID }}
          GFS_R2_ACCOUNT_ID: ${{ secrets.GFS_R2_ACCOUNT_ID }}
          TARGET_BUCKET: ${{ secrets.IFS_R2_BUCKET }}
          TARGET_KEY: ${{ secrets.IFS_R2_ACCESS_KEY_ID }}
          TARGET_SECRET: ${{ secrets.IFS_R2_SECRET_ACCESS_KEY }}
        run: |
          python automation/production.py check
          if [ -f "$RUNNER_TEMP/scheduled-metadata.json" ]; then
            mv "$RUNNER_TEMP/scheduled-metadata.json" "$RUNNER_TEMP/scheduled-metadata-IFS.json"
          fi
      - name: Inspect GFS
        id: gfs
        if: env.SCOPE == 'auto'
        env:
          MODEL: GFS
          IFS_R2_ACCOUNT_ID: ${{ secrets.IFS_R2_ACCOUNT_ID }}
          GFS_R2_ACCOUNT_ID: ${{ secrets.GFS_R2_ACCOUNT_ID }}
          TARGET_BUCKET: ${{ secrets.GFS_R2_BUCKET }}
          TARGET_KEY: ${{ secrets.GFS_R2_ACCESS_KEY_ID }}
          TARGET_SECRET: ${{ secrets.GFS_R2_SECRET_ACCESS_KEY }}
        run: |
          python automation/production.py check
          if [ -f "$RUNNER_TEMP/scheduled-metadata.json" ]; then
            mv "$RUNNER_TEMP/scheduled-metadata.json" "$RUNNER_TEMP/scheduled-metadata-GFS.json"
          fi
      - name: Prepare batch for each ready model
        if: env.SCOPE == 'auto'
        env:
          IFS_PUBLISH: ${{ steps.ifs.outputs.publish }}
          GFS_PUBLISH: ${{ steps.gfs.outputs.publish }}
          IFS_R2_ACCOUNT_ID: ${{ secrets.IFS_R2_ACCOUNT_ID }}
          GFS_R2_ACCOUNT_ID: ${{ secrets.GFS_R2_ACCOUNT_ID }}
          IFS_BUCKET: ${{ secrets.IFS_R2_BUCKET }}
          IFS_KEY: ${{ secrets.IFS_R2_ACCESS_KEY_ID }}
          IFS_SECRET: ${{ secrets.IFS_R2_SECRET_ACCESS_KEY }}
          GFS_BUCKET: ${{ secrets.GFS_R2_BUCKET }}
          GFS_KEY: ${{ secrets.GFS_R2_ACCESS_KEY_ID }}
          GFS_SECRET: ${{ secrets.GFS_R2_SECRET_ACCESS_KEY }}
        shell: bash
        run: |
          # 只有这里清旧批与登记调度尝试，分片只负责上传各自时次。
          prepare() {
            model="$1"; metadata="$2"; processor="$3"
            export MODEL="$model" PROCESSOR_COMMIT="$processor"
            case "$model" in
              IFS) bucket="$IFS_BUCKET"; key="$IFS_KEY"; secret="$IFS_SECRET" ;;
              GFS) bucket="$GFS_BUCKET"; key="$GFS_KEY"; secret="$GFS_SECRET" ;;
            esac
            # production.py 认 TARGET_*，batch.py 认 <MODEL>_R2_*，两边都要给。
            export TARGET_BUCKET="$bucket" TARGET_KEY="$key" TARGET_SECRET="$secret"
            export "${model}_R2_BUCKET=$bucket" "${model}_R2_ACCESS_KEY_ID=$key" "${model}_R2_SECRET_ACCESS_KEY=$secret"
            # begin 只认固定的 scheduled-metadata.json，按模式换回它要的那一份。
            cp "$metadata" "$RUNNER_TEMP/scheduled-metadata.json"
            python automation/production.py begin
            python scripts/batch.py --metadata "$metadata" --model "$MODEL" --profile full --leads all --mode r2 \
              --shard 0/4 --prepare-only --product-workers 4 --work "$RUNNER_TEMP/work" --report "$RUNNER_TEMP/report/run.json"
          }
          if [ "$IFS_PUBLISH" = 'true' ]; then
            prepare IFS "$RUNNER_TEMP/scheduled-metadata-IFS.json" "$GITHUB_SHA"
          fi
          if [ "$GFS_PUBLISH" = 'true' ]; then
            prepare GFS "$RUNNER_TEMP/scheduled-metadata-GFS.json" "$GITHUB_SHA"
          fi
      - name: Choose shard targets
        id: plan
        env:
          IFS_PUBLISH: ${{ steps.ifs.outputs.publish }}
          GFS_PUBLISH: ${{ steps.gfs.outputs.publish }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          scope = os.environ.get('SCOPE') or 'auto'
          targets = []
          if scope == 'auto':
              for model in ('IFS', 'GFS'):
                  if os.environ.get(model + '_PUBLISH') == 'true':
                      # 分片矩阵固定用本次运行的代码：旧版本没有 --shard，恢复旧处理器只会在第一步就退出。
                      for shard in range(4):
                          targets.append({'model': model, 'shard': shard, 'total': 4,
                                          'processor': os.environ['GITHUB_SHA']})
          else:
              # 手动触发是诊断入口，始终单任务跑全量，不受源站就绪判断影响。
              for model in ('IFS', 'GFS'):
                  targets.append({'model': model, 'shard': 0, 'total': 1, 'processor': os.environ['GITHUB_SHA']})
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              print('targets=' + json.dumps(targets, separators=(',', ':')), file=out)
              print('count=' + str(len(targets)), file=out)
          PY
      - name: Upload scheduled metadata
        if: env.SCOPE == 'auto' && steps.plan.outputs.count != '0'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scheduled-metadata
          path: ${{ runner.temp }}/scheduled-metadata-*.json
          retention-days: 1
          if-no-files-found: error
  publish:
    needs: prepare
    if: needs.prepare.outputs.count != '0'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.targets) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      POLYGON_CLIPPING_MAX_QUEUE_SIZE: '2000000'
      MODEL: ${{ matrix.model }}
      SHARD: ${{ matrix.shard }}/${{ matrix.total }}
      SCOPE: ${{ inputs.scope || 'auto' }}
    concurrency:
      group: auto-weather-${{ matrix.model }}-${{ matrix.shard }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '26'
          package-manager-cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Download scheduled metadata
        if: env.SCOPE == 'auto'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: scheduled-metadata
          path: ${{ runner.temp }}
      - name: Restore processor for an interrupted cycle
        if: env.SCOPE == 'auto' && matrix.processor != '' && matrix.processor != github.sha
        env:
          REVISION: ${{ matrix.processor }}
        run: |
          git merge-base --is-ancestor "$REVISION" "$GITHUB_SHA"
          git restore --source="$REVISION" -- scripts src package.json package-lock.json requirements.txt
      - name: Install processor
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          python -m pip install --no-cache-dir -r requirements.txt
      - name: Publish a shard to model's private R2 bucket
        if: env.SCOPE == 'auto'
        env:
          IFS_R2_ACCOUNT_ID: ${{ secrets.IFS_R2_ACCOUNT_ID }}
          GFS_R2_ACCOUNT_ID: ${{ secrets.GFS_R2_ACCOUNT_ID }}
          TARGET_BUCKET: ${{ secrets[format('{0}_R2_BUCKET', matrix.model)] }}
          TARGET_KEY: ${{ secrets[format('{0}_R2_ACCESS_KEY_ID', matrix.model)] }}
          TARGET_SECRET: ${{ secrets[format('{0}_R2_SECRET_ACCESS_KEY', matrix.model)] }}
          PROCESSOR_COMMIT: ${{ matrix.processor }}
        shell: bash
        run: |
          export "${MODEL}_R2_BUCKET=$TARGET_BUCKET" "${MODEL}_R2_ACCESS_KEY_ID=$TARGET_KEY" "${MODEL}_R2_SECRET_ACCESS_KEY=$TARGET_SECRET"
          python scripts/batch.py --metadata "$RUNNER_TEMP/scheduled-metadata-${MODEL}.json" --shard "$SHARD" --skip-prepare \
            --model "$MODEL" --profile full --leads all --mode r2 \
            --product-workers 4 --work "$RUNNER_TEMP/work" --report "$RUNNER_TEMP/report/run.json"
      - name: Publish selected products
        if: env.SCOPE != 'auto'
        env:
          IFS_R2_ACCOUNT_ID: ${{ secrets.IFS_R2_ACCOUNT_ID }}
          GFS_R2_ACCOUNT_ID: ${{ secrets.GFS_R2_ACCOUNT_ID }}
          TARGET_BUCKET: ${{ secrets[format('{0}_R2_BUCKET', matrix.model)] }}
          TARGET_KEY: ${{ secrets[format('{0}_R2_ACCESS_KEY_ID', matrix.model)] }}
          TARGET_SECRET: ${{ secrets[format('{0}_R2_SECRET_ACCESS_KEY', matrix.model)] }}
          PROCESSOR_COMMIT: ${{ matrix.processor }}
        shell: bash
        run: |
          export "${MODEL}_R2_BUCKET=$TARGET_BUCKET" "${MODEL}_R2_ACCESS_KEY_ID=$TARGET_KEY" "${MODEL}_R2_SECRET_ACCESS_KEY=$TARGET_SECRET"
          case "$SCOPE" in
            height) profile=500hpa; leads=0 ;;
            full) profile=full; leads=all ;;
            *) exit 2 ;;
          esac
          python scripts/batch.py --model "$MODEL" --profile "$profile" --leads "$leads" --mode r2 \
            --product-workers 4 --work "$RUNNER_TEMP/work" --report "$RUNNER_TEMP/report/run.json"
